services:
  figma-bridge-service:
    build:
      context: .
    image: ${FIGMA_BRIDGE_IMAGE:-ghcr.io/shahabmosavi/figma-bridge-service:latest}
    container_name: figma-bridge-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
