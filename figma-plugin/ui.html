<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Design Jobs</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f9fafb;
    }

    header {
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      cursor: pointer;
    }

    button.secondary {
      color: #111827;
      background: #e5e7eb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status {
      min-height: 20px;
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #4b5563;
    }

    .status.error {
      color: #b91c1c;
    }

    .status.success {
      color: #047857;
    }

    .jobs {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card,
    .empty,
    .config,
    .debug-panel {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      background: #ffffff;
    }

    .config,
    .debug-panel {
      margin-bottom: 12px;
    }

    .empty {
      color: #6b7280;
      text-align: center;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #6b7280;
    }

    .issue {
      font-weight: 800;
      color: #2563eb;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #1d4ed8;
      background: #dbeafe;
    }

    .mode-badge.screen {
      color: #047857;
      background: #d1fae5;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.35;
    }

    p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #374151;
    }

    code {
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      word-break: break-word;
    }

    .panel-title {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 800;
      color: #111827;
    }

    .warning {
      color: #b45309;
      font-weight: 700;
    }

    .debug-log {
      max-height: 190px;
      overflow: auto;
      padding: 10px;
      border-radius: 6px;
      background: #111827;
      color: #d1d5db;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <header>
    <h1>AI Design Jobs</h1>
  </header>

  <section class="config">
    <div class="panel-title">Config</div>
    <p><strong>Backend base URL:</strong> <code id="backendUrl"></code></p>
    <p><strong>Design tokens:</strong> <span id="tokenStatus">fallback</span></p>
    <p><strong>Manifest:</strong> allow this exact domain in <code>networkAccess.allowedDomains</code>. See README debugging notes.</p>
    <p id="httpsWarning" class="warning"></p>
  </section>

  <div class="actions">
    <button id="refreshButton" class="secondary" type="button">Refresh pending jobs</button>
    <button id="healthButton" class="secondary" type="button">Test Health</button>
  </div>

  <p id="status" class="status">Ready to fetch pending jobs.</p>
  <main id="jobs" class="jobs"></main>

  <section class="debug-panel">
    <div class="panel-title">Debug Log</div>
    <div id="debugLog" class="debug-log"></div>
  </section>

  <script>
    const BACKEND_BASE_URL = "https://drinking-ragged-dense.ngrok-free.dev";

    const refreshButton = document.getElementById("refreshButton");
    const healthButton = document.getElementById("healthButton");
    const statusElement = document.getElementById("status");
    const jobsElement = document.getElementById("jobs");
    const backendUrlElement = document.getElementById("backendUrl");
    const tokenStatusElement = document.getElementById("tokenStatus");
    const httpsWarningElement = document.getElementById("httpsWarning");
    const debugLogElement = document.getElementById("debugLog");
    const inFlightJobs = new Map();
    const pendingFetches = new Map();
    const hardScreenIndicators = [
      "screen draft",
      "screen scaffold",
      "product screen",
      "dashboard",
      "dashboard overview",
      "conversation dashboard",
      "onboarding screen",
      "settings screen",
      "pricing screen"
    ];
    const hardDesignSystemTitleIndicators = [
      "create design system",
      "build design system",
      "define design system",
      "design system foundation",
      "design system scaffold",
      "initial figma design system rules",
      "design system rules"
    ];
    const designSystemExplicitKeywords = [
      "design system",
      "design foundation",
      "style guide",
      "visual language",
      "brand system"
    ];
    const designSystemSectionKeywords = [
      "color system",
      "color rules",
      "typography scale",
      "typography rules",
      "spacing scale",
      "spacing rules",
      "component foundation",
      "component rules",
      "state rules",
      "figma naming",
      "naming convention",
      "ai usage rules"
    ];
    const screenDraftNegativeKeywords = [
      "screen design",
      "screen layout",
      "screen scaffold",
      "product screen",
      "app screen",
      "ui screen",
      "page layout",
      "user flow",
      "onboarding screen",
      "login screen",
      "dashboard screen",
      "settings screen",
      "profile screen",
      "home screen",
      "feed screen",
      "detail screen",
      "list screen",
      "modal screen",
      "form screen"
    ];
    const fallbackDesignTokens = {
      colors: {
        brand: { primary: "#111827" },
        neutral: {
          "900": "#111827",
          "700": "#374151",
          "500": "#6B7280",
          "200": "#E5E7EB",
          "50": "#F9FAFB"
        },
        accent: { ai: "#635BFF" },
        semantic: {
          success: "#16A34A",
          warning: "#F59E0B",
          error: "#DC2626",
          info: "#2563EB"
        }
      },
      typography: {
        display: { fontSize: "40px", fontWeight: "bold" },
        h1: { fontSize: "32px", fontWeight: "bold" },
        h2: { fontSize: "24px", fontWeight: "semibold" },
        body: { fontSize: "16px", fontWeight: "regular" },
        label: { fontSize: "14px", fontWeight: "medium" },
        caption: { fontSize: "12px", fontWeight: "regular" }
      },
      spacing: [4, 8, 12, 16, 24, 32, 48, 64],
      radius: { sm: 6, md: 12, lg: 20 },
      shadows: {
        none: "none",
        cardSubtle: {
          type: "dropShadow",
          x: 0,
          y: 8,
          blur: 20,
          spread: -8,
          color: "rgba(17, 24, 39, 0.12)"
        },
        overlaySubtle: {
          type: "dropShadow",
          x: 0,
          y: 16,
          blur: 32,
          spread: -10,
          color: "rgba(17, 24, 39, 0.18)"
        }
      },
      components: {
        button: { primary: { name: "button.primary" }, secondary: { name: "button.secondary" } },
        input: { text: { name: "input.text" } },
        card: { dashboard: { name: "card.dashboard" }, emptyState: { name: "card.emptyState" } },
        status: { message: { name: "status.message" } }
      },
      states: ["default", "hover", "focus", "disabled", "loading", "error", "success", "empty"],
      figmaNaming: [
        "Color/Brand/Primary",
        "Color/Neutral/900",
        "Text/Heading/H1",
        "Component/Button/Primary",
        "Component/Input/Text/Default",
        "Effect/Shadow/Card"
      ],
      aiUsageRules: [
        "Use this token registry as the design source of truth.",
        "Prefer existing tokens before creating new values.",
        "Do not invent a new visual identity.",
        "Keep screens clear for non-technical Instagram business owners.",
        "Use simple SaaS layout patterns unless the Jira issue explicitly requires otherwise."
      ]
    };
    let cachedDesignTokens = fallbackDesignTokens;

    backendUrlElement.textContent = BACKEND_BASE_URL;
    tokenStatusElement.textContent = "fallback";
    if (BACKEND_BASE_URL.indexOf("https://") !== 0) {
      httpsWarningElement.textContent = "Warning: BACKEND_BASE_URL does not start with https://. Use the ngrok HTTPS URL for Figma plugin development.";
    }

    refreshButton.addEventListener("click", function () {
      logDebug("refresh button clicked");
      fetchPendingJobs();
    });
    healthButton.addEventListener("click", function () {
      logDebug("test health button clicked");
      testHealth();
    });
    window.addEventListener("message", handlePluginMessage);

    logDebug("plugin loaded");
    logDebug("PLUGIN VERSION: strict-detection-v3");
    logDebug("BACKEND_BASE_URL value", BACKEND_BASE_URL);
    logDebug("health URL", BACKEND_BASE_URL + "/health");
    logDebug("pending jobs URL", BACKEND_BASE_URL + "/figma/jobs/pending");
    loadTokensOnPluginStart();

    async function testHealth() {
      const healthUrl = BACKEND_BASE_URL + "/health";
      setStatus("Testing backend health...");
      healthButton.disabled = true;

      try {
        logDebug("health request URL", healthUrl);
        await fetchJson(healthUrl, "health");
        setStatus("Health check completed. See debug log for response details.", "success");
      } catch (error) {
        logFetchError("health fetch error", error);
        setStatus("Health request failed: " + getErrorMessage(error), "error");
      } finally {
        healthButton.disabled = false;
      }
    }

    async function fetchPendingJobs() {
      setStatus("Loading pending jobs...");
      refreshButton.disabled = true;
      jobsElement.innerHTML = "";

      try {
        const pendingJobsUrl = BACKEND_BASE_URL + "/figma/jobs/pending";
        logDebug("exact pending jobs URL", pendingJobsUrl);
        const payload = await fetchJson(pendingJobsUrl, "pending jobs");
        const jobs = Array.isArray(payload.jobs) ? payload.jobs : [];

        renderJobs(jobs);
        setStatus(jobs.length ? "Loaded " + jobs.length + " pending job" + (jobs.length === 1 ? "" : "s") + "." : "No pending jobs found.");
      } catch (error) {
        jobsElement.innerHTML = "";
        logFetchError("pending jobs fetch error", error);
        setStatus("Backend request failed: " + getErrorMessage(error), "error");
      } finally {
        refreshButton.disabled = false;
      }
    }

    function renderJobs(jobs) {
      jobsElement.innerHTML = "";

      if (!jobs.length) {
        jobsElement.innerHTML = '<div class="empty">No pending jobs exist.</div>';
        return;
      }

      for (const job of jobs) {
        const jobModeResult = getJobMode(job);
        const modeLabel = jobModeResult.mode;
        const modeClass = modeLabel === "Design System" ? "mode-badge" : "mode-badge screen";
        logDebug("[card] issueKey: " + (job.issueKey || "none"));
        logDebug("[card] title/briefTitle: " + jobModeResult.titleText);
        logDebug("[card] hardScreenMatches: " + JSON.stringify(jobModeResult.hardScreenMatches));
        logDebug("[card] hardDSTitleMatches: " + JSON.stringify(jobModeResult.hardDsTitleMatches));
        logDebug("[card] dsExplicitMatches: " + JSON.stringify(jobModeResult.explicitMatches));
        logDebug("[card] dsSectionCount: " + jobModeResult.sectionCount);
        logDebug("[card] final mode: " + modeLabel);
        const card = document.createElement("section");
        card.className = "card";
        card.innerHTML = `
            <div class="meta">
              <span class="issue">${escapeHtml(job.issueKey || "No issue")}</span>
              <span class="${modeClass}">${modeLabel}</span>
              <span>${escapeHtml(formatDate(job.createdAt))}</span>
            </div>
            <h2>${escapeHtml(job.briefTitle || "Untitled design job")}</h2>
            <p>${escapeHtml(job.objective || "No objective provided.")}</p>
            <p><strong>Target user:</strong> ${escapeHtml(job.targetUser || "Not specified")}</p>
          `;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Create Figma Draft";
        button.addEventListener("click", function () {
          createDraft(job, button);
        });
        card.appendChild(button);
        jobsElement.appendChild(card);
      }
    }

    async function createDraft(job, button) {
      if (!job.jobId) {
        setStatus("Cannot create draft: this job does not include a jobId.", "error");
        return;
      }

      inFlightJobs.set(job.jobId, { job: job, button: button });
      button.disabled = true;
      button.textContent = "Creating...";
      setStatus("Creating Figma draft for " + (job.issueKey || job.jobId) + "...");
      const clickedMode = getJobMode(job);
      logDebug("[click] issueKey: " + (job.issueKey || "none"));
      logDebug("[click] mode from getJobMode: " + clickedMode.mode);

      const tokens = await loadLatestTokensForDraft();
      logDebug("tokens used for draft creation", summarizeTokens(tokens));

      parent.postMessage(
        {
          pluginMessage: {
            type: "create-draft",
            job: job,
            tokens: tokens
          }
        },
        "*"
      );
    }

    async function handlePluginMessage(event) {
      const message = event.data.pluginMessage;
      if (!message) {
        return;
      }

      if (message.type === "fetch-response") {
        const pending = pendingFetches.get(message.requestId);
        if (!pending) {
          return;
        }
        pendingFetches.delete(message.requestId);
        if (message.error) {
          const errMsg = typeof message.error === "string" ? message.error : JSON.stringify(message.error);
          pending.reject(new TypeError(errMsg));
          return;
        }
        const bodyText = message.text;
        pending.resolve({
          ok: message.ok,
          status: message.status,
          text: function () { return Promise.resolve(bodyText); }
        });
        return;
      }

      logDebug("received plugin message", message);

      if (message.type === "frame-created") {
        await completeJob(message);
        return;
      }

      if (message.type === "frame-create-error") {
        await failJob(message.jobId, message.reason || "Figma frame creation failed.");
      }
    }

    async function completeJob(message) {
      const inFlight = inFlightJobs.get(message.jobId);

      try {
        const completeUrl = BACKEND_BASE_URL + "/figma/jobs/" + encodeURIComponent(message.jobId) + "/complete";
        const completePayload = { figmaFrameId: message.figmaFrameId };
        if (message.figmaFileKey) completePayload.figmaFileKey = message.figmaFileKey;
        if (message.figmaFileUrl) completePayload.figmaFileUrl = message.figmaFileUrl;
        if (message.figmaFrameUrl) completePayload.figmaFrameUrl = message.figmaFrameUrl;
        logDebug("complete job URL", completeUrl);
        logDebug("complete job payload", completePayload);
        await postJson(completeUrl, completePayload);

        setStatus("Figma draft created and backend job marked completed.", "success");
        await fetchPendingJobs();
      } catch (error) {
        resetInFlightButton(inFlight);
        logFetchError("complete job error", error);
        setStatus("Draft was created, but completion callback failed: " + getErrorMessage(error), "error");
      } finally {
        inFlightJobs.delete(message.jobId);
      }
    }

    async function failJob(jobId, reason) {
      const inFlight = inFlightJobs.get(jobId);

      try {
        const failUrl = BACKEND_BASE_URL + "/figma/jobs/" + encodeURIComponent(jobId) + "/fail";
        logDebug("fail job URL", failUrl);
        await postJson(failUrl, { reason: reason });
        setStatus("Frame creation failed and backend job was marked failed: " + reason, "error");
        await fetchPendingJobs();
      } catch (error) {
        resetInFlightButton(inFlight);
        logFetchError("fail job error", error);
        setStatus("Frame creation failed: " + reason + ". Backend fail callback also failed: " + getErrorMessage(error), "error");
      } finally {
        inFlightJobs.delete(jobId);
      }
    }

    function pluginFetch(url, options) {
      return new Promise(function (resolve, reject) {
        const requestId = Date.now().toString(36) + Math.random().toString(36).slice(2);
        pendingFetches.set(requestId, { resolve: resolve, reject: reject });
        parent.postMessage({
          pluginMessage: {
            type: "fetch-request",
            requestId: requestId,
            url: url,
            method: options.method || "GET",
            headers: options.headers || {},
            body: options.body
          }
        }, "*");
      });
    }

    async function loadTokensOnPluginStart() {
      try {
        cachedDesignTokens = await fetchDesignTokens();
        setTokenStatus("loaded");
      } catch (error) {
        cachedDesignTokens = fallbackDesignTokens;
        setTokenStatus("fallback");
        logFetchError("tokens fetch failed, using fallback", error);
      }
    }

    async function loadLatestTokensForDraft() {
      try {
        cachedDesignTokens = await fetchDesignTokens();
        setTokenStatus("loaded");
        return cachedDesignTokens;
      } catch (error) {
        cachedDesignTokens = fallbackDesignTokens;
        setTokenStatus("fallback");
        logFetchError("tokens fetch failed, using fallback", error);
        return fallbackDesignTokens;
      }
    }

    async function fetchDesignTokens() {
      const tokensUrl = BACKEND_BASE_URL + "/design-system/tokens";
      logDebug("tokens fetch started", { url: tokensUrl });
      const tokens = await fetchJson(tokensUrl, "design tokens");
      logDebug("tokens fetch success", summarizeTokens(tokens));
      return tokens;
    }

    function setTokenStatus(status) {
      tokenStatusElement.textContent = status;
    }

    function summarizeTokens(tokens) {
      return {
        colorGroups: tokens && tokens.colors ? Object.keys(tokens.colors) : [],
        typography: tokens && tokens.typography ? Object.keys(tokens.typography) : [],
        spacingCount: tokens && Array.isArray(tokens.spacing) ? tokens.spacing.length : 0,
        radius: tokens ? tokens.radius : null
      };
    }

    async function fetchJson(url, label) {
      logDebug(label + " fetch started", { url: url });
      const response = await pluginFetch(url, {
        method: "GET",
        headers: { "Accept": "application/json" }
      });

      logDebug(label + " fetch resolved");
      logDebug(label + " HTTP status", { status: response.status, ok: response.ok });

      return parseJsonResponse(response, label);
    }

    async function postJson(url, body) {
      logDebug("POST fetch started", { url: url, body: body });
      const response = await pluginFetch(url, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      logDebug("POST fetch resolved");
      logDebug("POST HTTP status", { status: response.status, ok: response.ok });

      return parseJsonResponse(response, "POST");
    }

    async function parseJsonResponse(response, label) {
      const responseText = await response.text();
      logDebug(label + " response text before JSON parse", responseText);

      let payload = {};
      if (responseText) {
        try {
          payload = JSON.parse(responseText);
          logDebug(label + " parsed JSON", payload);
        } catch (error) {
          logFetchError(label + " JSON parse error", error);
          throw new Error("Invalid JSON response: " + getErrorMessage(error));
        }
      } else {
        logDebug(label + " parsed JSON", payload);
      }

      if (!response.ok || payload.success === false) {
        throw new Error(payload.message || payload.error || "Request failed with HTTP " + response.status);
      }
      return payload;
    }

    function resetInFlightButton(inFlight) {
      if (!inFlight || !inFlight.button) {
        return;
      }

      inFlight.button.disabled = false;
      inFlight.button.textContent = "Create Figma Draft";
    }

    function setStatus(message, variant) {
      statusElement.textContent = message;
      statusElement.className = ("status " + (variant || "")).trim();
    }

    function getErrorMessage(error) {
      if (error && error.message) {
        return error.message;
      }

      return String(error || "Unknown network error");
    }

    function logFetchError(message, error) {
      logDebug(message, {
        name: error && error.name ? error.name : "",
        message: getErrorMessage(error),
        stack: error && error.stack ? error.stack : ""
      }, true);
    }

    function logDebug(message, data, isError) {
      const timestamp = new Date().toISOString();
      let line = "[" + timestamp + "] " + message;

      if (data !== undefined) {
        line += " " + stringifyDebugData(data);
      }

      debugLogElement.textContent += line + "\n";
      debugLogElement.scrollTop = debugLogElement.scrollHeight;

      if (isError) {
        console.error("[AI Design Jobs]", message, data);
      } else {
        console.log("[AI Design Jobs]", message, data);
      }
    }

    function stringifyDebugData(data) {
      if (typeof data === "string") {
        return data;
      }

      try {
        return JSON.stringify(data);
      } catch (error) {
        return String(data);
      }
    }

    function getJobMode(job) {
      const titleText = String(job.briefTitle || job.title || "").toLowerCase();
      const objectiveText = String(job.objective || "").toLowerCase();
      const combinedText = [
        job.issueKey,
        job.briefTitle,
        job.title,
        job.objective,
        job.figmaInstruction,
        job.requiredSections,
        job.acceptanceCriteria,
        job.targetUser
      ].join(" ").toLowerCase();

      const hardScreenMatches = hardScreenIndicators.filter(function (k) { return titleText.indexOf(k) >= 0; });
      const hardDsTitleMatches = hardDesignSystemTitleIndicators.filter(function (k) { return titleText.indexOf(k) >= 0; });
      const explicitMatches = designSystemExplicitKeywords.filter(function (k) { return combinedText.indexOf(k) >= 0; });
      const sectionMatches = designSystemSectionKeywords.filter(function (k) { return combinedText.indexOf(k) >= 0; });
      const screenNegMatches = screenDraftNegativeKeywords.filter(function (k) { return combinedText.indexOf(k) >= 0; });

      var mode;
      if (hardScreenMatches.length > 0 && hardDsTitleMatches.length === 0) {
        mode = "Screen Draft";
      } else if (
        objectiveText.indexOf("product screen draft") >= 0 ||
        objectiveText.indexOf("dashboard screen") >= 0 ||
        objectiveText.indexOf("dashboard overview") >= 0
      ) {
        mode = "Screen Draft";
      } else {
        const hasExplicit = explicitMatches.length > 0;
        const hasManySections = sectionMatches.length >= 4;
        const hasScreenSignal = screenNegMatches.length > 0;
        mode = (hasExplicit || hasManySections) && !hasScreenSignal ? "Design System" : "Screen Draft";
      }

      return {
        mode: mode,
        titleText: titleText,
        hardScreenMatches: hardScreenMatches,
        hardDsTitleMatches: hardDsTitleMatches,
        explicitMatches: explicitMatches,
        sectionCount: sectionMatches.length
      };
    }

    function isDesignSystemJob(job) {
      return getJobMode(job).mode === "Design System";
    }

    function formatDate(value) {
      if (!value) {
        return "No created date";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>

</html>
